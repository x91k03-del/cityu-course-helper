  <script>
    (()=>{
      const root=document.getElementById('cm-schedules-20261115');
      const data=JSON.parse(root.querySelector('#cm-schedule-data').textContent);
      const select=root.querySelector('#cm-profile'),source=root.querySelector('#cm-source');
      const svg=root.querySelector('.cm-week'),body=root.querySelector('#cm-agenda-rows');
      const days=['Mon','Tue','Wed','Thu','Fri','Sat'];
      const rank=['MA4542','MA3512','MA4545','MA3518','MA3521','MA2508','MA3525','MA2503','MA2509','MA1300','MA1502'];
      const ns='http://www.w3.org/2000/svg';
      function node(tag,attrs={},text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
      function minutes(t){if(!/^\d{2}:\d{2}$/.test(t||''))return NaN;const [h,m]=t.split(':').map(Number);return h*60+m}
      for(const p of data.profiles){const o=document.createElement('option');o.value=p.id;o.textContent=p.id+' · '+p.label;select.append(o)}
      function restore(s){if(data.profiles.some(p=>p.id===s?.profile))select.value=s.profile;if(['model','reference'].includes(s?.source))source.value=s.source}
      restore(window.openai?.widgetState?.modelContent);
      let events=[];
      function draw(){
        const width=svg.getBoundingClientRect().width;if(width<100)return;
        const left=51,top=30,height=410,column=(width-left-5)/6;
        svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} 460`);
        svg.append(node('title',{},select.selectedOptions[0].textContent+'; '+source.selectedOptions[0].textContent));
        for(let h=9;h<=19;h++){
          const y=top+(h-9)*height/10;
          svg.append(node('line',{x1:left,y1:y,x2:width-5,y2:y,stroke:'var(--border)','stroke-width':1}));
          svg.append(node('text',{x:0,y:y+4,fill:'var(--muted-foreground)',class:'text-small'},String(h).padStart(2,'0')+':00'));
        }
        days.forEach((day,index)=>{
          const x=left+index*column;
          svg.append(node('text',{x:x+column/2,y:17,'text-anchor':'middle',fill:'var(--foreground)'},day));
          if(index)svg.append(node('line',{x1:x,y1:top,x2:x,y2:top+height,stroke:'var(--border)','stroke-width':1}));
          const list=events.filter(e=>e.day===day&&Number.isFinite(minutes(e.start_time))&&minutes(e.end_time)>minutes(e.start_time)).sort((a,b)=>minutes(a.start_time)-minutes(b.start_time));
          const ends=[];
          for(const e of list){let lane=ends.findIndex(t=>t<=minutes(e.start_time));if(lane<0)lane=ends.length;ends[lane]=minutes(e.end_time);e.lane=lane}
          for(const e of list){
            const lanes=Math.max(1,ends.length),w=column/lanes-6;
            const x1=x+e.lane*column/lanes+3;
            const start=Math.max(540,minutes(e.start_time)),end=Math.min(1140,minutes(e.end_time));if(end<=start)continue;
            const y=top+(start-540)*height/600,h=(end-start)*height/600;
            const g=node('g',{'data-tooltip':`${e.course_code} ${e.section} · ${day} ${e.start_time}–${e.end_time}`,'aria-label':`${e.course_code}, ${e.section}, ${day}, ${e.start_time} to ${e.end_time}`});
            g.append(node('rect',{x:x1,y:y+1,width:Math.max(1,w),height:Math.max(1,h-2),rx:3,
              fill:`color-mix(in srgb,var(--viz-series-${(Math.max(0,rank.indexOf(e.course_code))%6)+1}) 24%, transparent)`}));
            const label=w>67?e.course_code:e.course_code.replace('MA','');
            if(w>30)g.append(node('text',{x:x1+4,y:y+16,fill:'var(--foreground)',class:'text-small'},label));
            if(w>30&&h>37)g.append(node('text',{x:x1+4,y:y+32,fill:'var(--foreground)',class:'text-small'},e.section));
            svg.append(g);
          }
        });
      }
      function render(){
        const p=data.profiles.find(p=>p.id===select.value),reference=source.value==='reference';
        const options=reference?p.reference:p.model;
        events=options.flatMap(o=>(o.meetings||[]).map(m=>({...m,course_code:o.course_code})));
        root.querySelector('#cm-courses').textContent=(reference?'Reference: ':'Model: ')+(options.map(o=>o.course_code).join(' · ')||'No valid generated schedule');
        const status=root.querySelector('#cm-status');status.className=(!reference&&!p.passed)?'text-destructive':'';
        status.textContent=reference?'Independent source-based reference under the experiment assumptions.':
          p.passed?'PASS — all transcript, rule, clock-time and objective checks.':'FAIL — '+(p.errors.join('; ')||'one or more objective or uncertainty checks.');
        root.querySelector('#cm-transcript').textContent='Fictional transcript: '+p.transcript;
        body.replaceChildren();
        for(const e of [...events].sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||minutes(a.start_time)-minutes(b.start_time))){
          const tr=document.createElement('tr');for(const v of [e.course_code+' / '+e.section,e.day,e.start_time+'–'+e.end_time]){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)
        }
        draw();
      }
      function change(){render();window.openai?.setWidgetState?.({modelContent:{profile:select.value,source:source.value}})?.catch(()=>{})}
      select.addEventListener('change',change);source.addEventListener('change',change);
      window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);render()});
      new ResizeObserver(draw).observe(svg);render();
    })();
  </script>
</div>
